<style>
:root{font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",sans-serif;color:#182637;background:#f4f6fa;font-synthesis:none;--navy:#102d4c;--blue:#1769aa;--blue2:#eaf3fb;--muted:#64748b;--line:#e1e7ee;--surface:#fff;--green:#18794e;--red:#b42318;--shadow:0 8px 24px #142d4610}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:var(--navy);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:12px;padding:0 8px}.logo{display:grid;place-items:center;width:40px;height:40px;background:#f4b942;border-radius:12px;color:#18314c;font-weight:900;font-size:21px}.brand strong{font-size:15px;display:block}.brand small{color:#b8c8d9}.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#9eb2c7;padding:0 12px;margin:4px 0 8px}.nav{display:grid;gap:5px}.nav button{border:0;text-align:left;color:#d9e3ee;background:transparent;padding:11px 12px;border-radius:9px;display:flex;gap:11px;align-items:center}.nav button:hover,.nav button.active{background:#ffffff19;color:#fff}.nav .ico{width:20px;text-align:center}.sidebar-foot{margin-top:auto;border-top:1px solid #ffffff26;padding:15px 8px;color:#b8c8d9;font-size:12px;line-height:1.5}.main{min-width:0}.topbar{height:72px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:4}.crumb{font-size:13px;color:var(--muted)}.profile{display:flex;align-items:center;gap:11px;font-size:13px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#e5f0fa;color:var(--blue);font-weight:700}.wrap{max-width:1240px;padding:30px 34px 56px;margin:auto}.banner{background:#fff8e8;border:1px solid #f4d68b;color:#79520a;border-radius:9px;padding:10px 14px;font-size:12px;margin-bottom:22px}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px}.eyebrow{color:var(--blue);text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:700}.heading h1{margin:4px 0 6px;font-size:26px;color:#142d46}.sub{margin:0;color:var(--muted);font-size:14px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid #d3dce6;background:white;color:#24394e;padding:9px 14px;border-radius:8px;font-weight:600;font-size:13px}.btn:hover{background:#f6f8fb}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.primary:hover{background:#10588e}.btn.danger{color:var(--red);border-color:#f2c7c4}.btn.sm{padding:6px 9px;font-size:12px}.card{background:white;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:18px}.card-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.card-head h2{font-size:15px;margin:0}.card-body{padding:20px}.grid{display:grid;gap:15px;grid-template-columns:repeat(12,1fr)}.field{grid-column:span 6;display:grid;gap:6px}.field.full{grid-column:1/-1}.field.third{grid-column:span 4}.field label{font-size:12px;font-weight:650;color:#34465a}.req{color:var(--red)}input,select{width:100%;height:40px;border:1px solid #ccd6e1;border-radius:7px;padding:0 11px;color:#1d2e40;background:#fff;outline:none}input:focus,select:focus{border-color:#438bc3;box-shadow:0 0 0 3px #1b76b51a}.hint{color:var(--muted);font-size:11px}.error{color:var(--red);font-size:12px;margin-top:3px}.alert{padding:12px 14px;border-radius:8px;font-size:13px;margin:0 0 16px}.alert.info{background:#edf5fc;color:#25567d}.alert.success{background:#ebf7f0;color:#17633f}.alert.warn{background:#fff8e8;color:#79520a}.alert.errorbox{background:#fdf0ef;color:#98231b}.alert:empty{display:none}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{text-align:left;font-weight:650;color:#627287;background:#f8fafc;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:13px 14px;border-bottom:1px solid #edf0f4;vertical-align:middle}.table tr:last-child td{border-bottom:0}.table tbody tr:hover{background:#fafcff}.muted{color:var(--muted)}.code{font-family:ui-monospace,monospace;color:#38536e;font-size:12px}.money{font-variant-numeric:tabular-nums;white-space:nowrap}.status{display:inline-flex;border-radius:99px;padding:4px 8px;background:#edf5fc;color:#285d87;font-size:11px;font-weight:650}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.stat{padding:18px}.stat span{display:block;font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:23px;margin-top:8px}.home-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.module{padding:21px;display:flex;gap:16px;align-items:flex-start}.module-ico{width:43px;height:43px;border-radius:11px;background:var(--blue2);display:grid;place-items:center;font-size:20px}.module h2{font-size:15px;margin:2px 0 7px}.module p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.5}.crumb-actions{margin-bottom:18px}.stepper{display:flex;gap:8px;align-items:center;color:#8190a0;font-size:12px;margin-bottom:20px}.stepper b{color:#263d54}.step{display:flex;align-items:center;gap:7px}.dot{height:23px;width:23px;border-radius:50%;display:grid;place-items:center;background:#e9eef3}.step.on .dot{background:var(--blue);color:white}.draft-summary{display:flex;gap:22px;flex-wrap:wrap;padding:14px 18px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12px}.draft-summary b{color:#263d54}.empty{text-align:center;padding:38px 18px;color:var(--muted)}.empty strong{display:block;color:#34465a;margin-bottom:5px}.modal-back{position:fixed;inset:0;background:#10233877;display:grid;place-items:center;padding:20px;z-index:8}.modal{background:white;width:min(540px,100%);border-radius:14px;box-shadow:0 20px 80px #091a2a55}.modal-body{padding:22px}.modal h2{margin:0 0 8px;font-size:18px}.modal p{color:var(--muted);font-size:14px;line-height:1.5}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.toast{position:fixed;right:22px;bottom:22px;background:#173d5e;color:white;padding:13px 18px;border-radius:9px;box-shadow:0 8px 25px #142d4633;z-index:10;font-size:13px;animation:pop .2s ease}@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.inline{display:flex;gap:9px}.inline>*:first-child{flex:1}.right{text-align:right}.disabled{opacity:.57;cursor:not-allowed}.footer-actions{display:flex;justify-content:space-between;gap:10px;align-items:center}.tab-row{display:flex;gap:7px;margin-bottom:16px}.tab{padding:8px 13px;border:1px solid var(--line);background:white;border-radius:7px;color:#4c6075;font-size:12px}.tab.active{background:var(--blue2);border-color:#bdd6e9;color:#135b91;font-weight:700}.login-shell{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;background:#f4f6fa}.login-visual{background:linear-gradient(140deg,#102d4c,#1c5882);color:white;padding:9vh 8vw;display:flex;flex-direction:column;justify-content:center}.login-visual h1{font-size:40px;line-height:1.15;max-width:570px;margin:25px 0 14px}.login-visual p{max-width:480px;color:#cfdae6;line-height:1.7}.login-side{display:grid;place-items:center;padding:30px}.login-card{width:min(410px,100%);padding:33px;background:white;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.login-card h2{margin:0 0 8px;font-size:24px}.login-card>p{margin:0 0 25px;color:var(--muted);font-size:14px}.login-card .field{grid-column:1/-1;margin-bottom:15px}.login-card .btn{width:100%;height:43px;margin-top:5px}.test-picker{position:fixed;right:16px;top:16px;z-index:6}.small{font-size:11px;color:var(--muted)}
@media(max-width:950px){.shell{grid-template-columns:76px 1fr}.sidebar{padding:20px 9px}.brand{justify-content:center;padding:0}.brand>span:not(.logo),.nav-label,.nav button .label,.sidebar-foot{display:none}.nav button{justify-content:center;padding:12px 8px}.nav button .ico{font-size:18px}.topbar{padding:0 20px}.wrap{padding:24px 20px 44px}}
@media(max-width:650px){.shell{display:block}.sidebar{position:fixed;z-index:5;bottom:0;left:0;right:0;height:62px;display:flex;flex-direction:row;padding:6px 9px;gap:0}.brand,.nav-label,.sidebar-foot{display:none}.nav{display:flex;width:100%;justify-content:space-around}.nav button{font-size:10px;flex-direction:column;gap:1px;padding:4px 8px}.nav button .label{display:block;font-size:9px}.nav button .ico{font-size:17px}.topbar{height:58px;padding:0 14px}.topbar .crumb{font-size:11px}.profile{font-size:11px}.avatar{width:31px;height:31px}.wrap{padding:20px 13px 85px}.heading{display:block}.heading h1{font-size:22px}.heading .actions{margin-top:15px}.grid{gap:12px}.field,.field.third{grid-column:1/-1}.stats{grid-template-columns:1fr}.home-grid{grid-template-columns:1fr}.table th,.table td{padding:10px}.login-shell{grid-template-columns:1fr}.login-visual{padding:35px 25px}.login-visual h1{font-size:29px;margin:16px 0 6px}.login-side{padding:20px 14px 85px}.login-card{padding:25px}.footer-actions{align-items:stretch;flex-direction:column-reverse}.footer-actions>div{display:flex;gap:8px}.footer-actions .btn{flex:1}.stepper{font-size:10px}.draft-summary{gap:12px}.test-picker{position:static;padding:8px 13px;background:#fff8e8;font-size:11px}}
@media(max-width:650px){.stats{grid-template-columns:1fr}.topbar .crumb{max-width:45vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.profile>span:not(.avatar){display:none}}</style>
</head>
<body><div id="app"></div><script>
const app=document.querySelector('#app');
const state={view:'home',employee:'Nguyễn Văn A',suppliers:[{id:101,code:'NCC000101',name:'Tuổi Trẻ',address:'Quận 1, TP. Hồ Chí Minh',phone:'+84912345678',email:'tuoitre@example.test'},{id:102,code:'NCC000102',name:'Kim Đồng',address:'Ba Đình, Hà Nội',phone:'0912345679',email:'kimdong@example.test'}],titles:[{id:1,name:'Doraemon Tập 1',author:'Fujiko F. Fujio',category:'Truyện tranh',publisher:'Kim Đồng',year:'2024'},{id:2,name:'Sách thiếu nhi',author:'Nguyễn Nhật Ánh',category:'Thiếu nhi',publisher:'Nhà xuất bản Trẻ',year:'2023'}],supplier:null,draft:[],filter:{from:'2025-01-01',to:'2025-01-31'},query:'',titleQuery:'',tab:'find',message:'',modal:null,scenario:'',formTitle:null};
const revenueRows=[{id:'HDT000001',date:'03/01/2025',supplier:101,amount:20000,books:'Doraemon Tập 1'},{id:'HDT000001',date:'03/01/2025',supplier:102,amount:30000,books:'Doraemon Tập 1'},{id:'HDT000002',date:'10/01/2025',supplier:101,amount:12000,books:'Doraemon Tập 1'},{id:'HDT000003',date:'31/01/2025',supplier:101,amount:5000,books:'Sách thiếu nhi'},{id:'HDT000004',date:'01/02/2025',supplier:102,amount:15000,books:'Doraemon Tập 1'}];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('vi-VN')+' ₫';const dmy=s=>s?s.split('-').reverse().join('/'):'';const selectedSupplier=()=>state.suppliers.find(x=>x.id===state.supplier);
function toast(text){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=text;document.body.append(el);setTimeout(()=>el.remove(),2800)}
function showFormError(text){state.message=text;const el=app.querySelector('.alert');if(el){el.textContent=text;el.classList.add('errorbox')}}
function setView(v){state.view=v;state.message='';render()}
function ask(title,text,callback,no='Ở lại',yes='Xác nhận'){state.modal={title,text,callback,no,yes};app.insertAdjacentHTML('beforeend',modalHtml())}
function leaveDraft(next){if(state.draft.length)ask('Rời phiếu nhập?', 'Các dòng chưa lưu sẽ bị mất. Bạn có muốn rời phiếu không?',()=>{state.draft=[];state.supplier=null;setView(next)});else{state.supplier=null;setView(next)}}
function shell(title,content,active='home'){return `<div class="shell"><aside class="sidebar"><div class="brand"><span class="logo">T</span><span><strong>Truyện Nhà Mình</strong><small>Quản lí cửa hàng</small></span></div><div><div class="nav-label">Không gian làm việc</div><nav class="nav"><button class="${active==='home'?'active':''}" data-act="nav-home"><span class="ico">⌂</span><span class="label">Trang chính</span></button><button class="${active==='supplier'?'active':''}" data-act="nav-supplier"><span class="ico">♧</span><span class="label">Nhà cung cấp</span></button><button class="${active==='import'?'active':''}" data-act="nav-import"><span class="ico">▤</span><span class="label">Nhập truyện</span></button><button class="${active==='report'?'active':''}" data-act="nav-report"><span class="ico">▥</span><span class="label">Thống kê</span></button></nav></div><div class="sidebar-foot">Module M3<br>Quản lí cửa hàng cho thuê truyện</div></aside><section class="main"><header class="topbar"><div class="crumb">Module M3 <span class="muted">/</span> ${esc(title)}</div><div class="profile"><span class="avatar">A</span><span>${esc(state.employee)}<br><span class="small">Nhân viên</span></span></div></header><main class="wrap"><div class="banner"><b>Bản prototype · dữ liệu minh họa</b> — thao tác không ghi vào cơ sở dữ liệu.</div>${content}</main></section></div>`}
function heading(kicker,title,sub,actions=''){return `<div class="heading"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="actions">${actions}</div></div>`}
function btn(label,act,primary=false,extra=''){return `<button class="btn ${primary?'primary':''} ${extra}" data-act="${act}">${label}</button>`}
function render(){if(state.view==='login'){renderLogin();return}let out='';const active=state.view==='supplier'||state.view==='supplier-edit'||state.view==='supplier-add'?'supplier':state.view.startsWith('import')||state.view.startsWith('title-')?'import':state.view==='report'||state.view==='invoice'?'report':'home';switch(state.view){case'home':out=home();break;case'supplier':out=supplierSearch();break;case'supplier-edit':out=supplierEdit();break;case'supplier-add':out=supplierForm();break;case'import-supplier':out=chooseImportSupplier();break;case'import-draft':out=importDraft();break;case'title-add':out=titleSearch();break;case'title-new':out=titleForm();break;case'title-existing':out=existingTitleForm();break;case'report':out=report();break;case'invoice':out=invoiceDetail();break;default:out=home()}app.innerHTML=shell(({home:'Trang chính',supplier:'Tìm nhà cung cấp','supplier-edit':'Sửa nhà cung cấp','supplier-add':'Thêm nhà cung cấp','import-supplier':'Chọn nhà cung cấp','import-draft':'Lập phiếu nhập','title-add':'Tìm đầu truyện','title-new':'Thêm đầu truyện','title-existing':'Thêm dòng nhập',report:'Thống kê NCC',invoice:'Chi tiết hóa đơn trả'})[state.view],out,active)+(state.modal?modalHtml():'');}
function home(){return `${heading('Tổng quan',`Chào ${esc(state.employee)}`,'Chọn chức năng bạn muốn thực hiện.')}
<div class="stats"><div class="card stat"><span>Nhà cung cấp</span><strong>${state.suppliers.length}</strong></div><div class="card stat"><span>Phiếu nhập trong prototype</span><strong>—</strong></div><div class="card stat"><span>Ngày làm việc</span><strong>11/11/2026</strong></div></div><div class="home-grid"><article class="card module"><div class="module-ico">♧</div><div><h2>Quản lí nhà cung cấp</h2><p>Tìm kiếm, xem và cập nhật thông tin nhà cung cấp.</p>${btn('Tìm nhà cung cấp','nav-supplier',true)}</div></article><article class="card module"><div class="module-ico">▤</div><div><h2>Nhập truyện</h2><p>Lập phiếu tạm, chọn đầu truyện và xác nhận thông tin nhập.</p>${btn('Lập phiếu nhập','nav-import',true)}</div></article><article class="card module"><div class="module-ico">▥</div><div><h2>Thống kê nhà cung cấp</h2><p>Xem doanh thu từ các hóa đơn trả trong khoảng ngày.</p>${btn('Xem thống kê','nav-report',true)}</div></article><article class="card module"><div class="module-ico">↪</div><div><h2>Phiếu tạm</h2><p>${state.draft.length?`${state.draft.length} dòng đang được giữ trong tab này.`:'Chưa có phiếu nhập đang lập.'}</p>${btn(state.draft.length?'Tiếp tục phiếu':'Bắt đầu phiếu','nav-import')}</div></article></div>`}
function supplierSearch(){const q=state.query.trim().toLocaleLowerCase('vi');const rows=state.suppliers.filter(s=>!q||[s.code,s.name,s.address].some(x=>x.toLocaleLowerCase('vi').includes(q)));return `${heading('Nhà cung cấp','Tìm nhà cung cấp','Tìm theo mã, tên hoặc địa chỉ.',btn('＋ Thêm nhà cung cấp','open-supplier-add',true))}<div class="card"><div class="card-body"><div class="field full"><label for="supplier-q">Từ khóa</label><div class="inline"><input id="supplier-q" value="${esc(state.query)}" placeholder="Nhập mã, tên hoặc địa chỉ"><button class="btn primary" data-act="search-supplier">Tìm kiếm</button></div><span class="hint">Có thể nhập một phần mã, tên hoặc địa chỉ.</span></div></div></div><div class="card"><div class="card-head"><h2>Kết quả tìm kiếm</h2><span class="small">${rows.length} kết quả</span></div>${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Mã NCC</th><th>Tên nhà cung cấp</th><th>Địa chỉ</th><th>Điện thoại</th><th>Email</th><th></th></tr></thead><tbody>${rows.map(s=>`<tr><td class="code">${esc(s.code)}</td><td><b>${esc(s.name)}</b></td><td>${esc(s.address)}</td><td>${esc(s.phone)}</td><td>${esc(s.email)}</td><td class="right"><button class="btn sm" data-act="edit-supplier" data-id="${s.id}">Sửa</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>Không tìm thấy nhà cung cấp</strong>Thử từ khóa khác hoặc thêm NCC mới.</div>`}</div>`}
function supplierForm(){return `${heading('Nhà cung cấp','Thêm nhà cung cấp','Nhập đủ thông tin để thêm NCC vào luồng nhập truyện.',btn('‹ Quay lại','back-suppliers'))}<div class="alert ${state.message?'errorbox':''}">${esc(state.message)}</div><form class="card" id="supplier-form"><div class="card-head"><h2>Thông tin nhà cung cấp</h2><span class="small"><span class="req">*</span> Bắt buộc</span></div><div class="card-body grid"><div class="field full"><label>Tên NCC <span class="req">*</span></label><input name="name" required maxlength="255"></div><div class="field full"><label>Địa chỉ <span class="req">*</span></label><input name="address" required maxlength="500"></div><div class="field"><label>Số điện thoại <span class="req">*</span></label><input name="phone" required maxlength="16" placeholder="+84912345678"></div><div class="field"><label>Email <span class="req">*</span></label><input name="email" required maxlength="254" type="email" placeholder="ncc@example.vn"></div><div class="field full footer-actions"><button type="button" class="btn" data-act="back-suppliers">Hủy</button><button class="btn primary">Thêm nhà cung cấp</button></div></div></form>`}
function supplierEdit(){const s=selectedSupplier();if(!s)return `${heading('Nhà cung cấp','Không tìm thấy NCC','Tải lại kết quả tìm kiếm.',btn('Về tìm kiếm','nav-supplier',true))}`;return `${heading('Nhà cung cấp','Sửa thông tin NCC','Mã NCC không thể chỉnh sửa.',btn('‹ Quay lại','nav-supplier'))}<div class="alert ${state.message?'errorbox':''}">${esc(state.message)}</div><form class="card" id="edit-supplier-form"><div class="card-head"><h2>${esc(s.name)} <span class="code">${esc(s.code)}</span></h2></div><div class="card-body grid"><div class="field"><label>Mã NCC</label><input value="${esc(s.code)}" readonly></div><div class="field"><label>Tên NCC <span class="req">*</span></label><input name="name" value="${esc(s.name)}" required maxlength="255"></div><div class="field full"><label>Địa chỉ <span class="req">*</span></label><input name="address" value="${esc(s.address)}" required maxlength="500"></div><div class="field"><label>Số điện thoại <span class="req">*</span></label><input name="phone" value="${esc(s.phone)}" required maxlength="16"></div><div class="field"><label>Email <span class="req">*</span></label><input name="email" value="${esc(s.email)}" required maxlength="254" type="email"></div><div class="field full footer-actions"><button type="button" class="btn" data-act="nav-supplier">Hủy</button><button class="btn primary">Lưu thay đổi</button></div></div></form>`}
function chooseImportSupplier(){return `${heading('Nhập truyện · Bước 1/2','Chọn nhà cung cấp','Phiếu tạm sẽ được tạo theo NCC đã chọn.',btn('‹ Trang chính','leave-home'))}<div class="card"><div class="card-body grid"><div class="field full"><label>Tìm NCC theo tên hoặc mã</label><input id="supplier-select-q" value="${esc(state.query)}" placeholder="Ví dụ: Tuổi Trẻ"></div><div class="field full"><div class="alert info">NCC chưa có? Thêm NCC ngay tại đây; phiếu tạm được giữ khi quay lại.</div><button class="btn" data-act="import-add-supplier">＋ Thêm nhà cung cấp mới</button></div></div></div><div id="supplier-select-list">${supplierSelectRows()}</div>`}
function supplierSelectRows(){const q=state.query.trim().toLocaleLowerCase('vi');const rows=state.suppliers.filter(s=>`${s.name} ${s.code}`.toLocaleLowerCase('vi').includes(q));return `<div class="card"><div class="card-head"><h2>Nhà cung cấp</h2><span class="small">${rows.length} kết quả</span></div>${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Mã</th><th>Tên</th><th>Địa chỉ</th><th></th></tr></thead><tbody>${rows.map(s=>`<tr><td class="code">${esc(s.code)}</td><td><b>${esc(s.name)}</b></td><td>${esc(s.address)}</td><td class="right"><button class="btn primary sm" data-act="select-supplier" data-id="${s.id}">Chọn</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>Không tìm thấy nhà cung cấp</strong>Điều chỉnh từ khóa hoặc thêm NCC mới.</div>`}</div>`}
function importDraft(){const s=selectedSupplier();return `${heading('Nhập truyện · Bước 2/2','Phiếu nhập tạm','Kiểm tra các dòng trước khi xác nhận lưu.',`<button class="btn" data-act="change-supplier">Đổi NCC</button> ${btn('＋ Thêm đầu truyện','add-title')}`)}<div class="alert ${state.message?'errorbox':''}">${esc(state.message)}</div><div class="stepper"><span class="step"><i class="dot">✓</i>Chọn nhà cung cấp</span> ━ <span class="step on"><i class="dot">2</i>Lập phiếu</span> ━ <span class="step"><i class="dot">3</i>Xác nhận</span></div><div class="card"><div class="draft-summary"><span>Nhà cung cấp: <b>${esc(s?.name||'Chưa chọn')}</b></span><span>Mã: <b class="code">${esc(s?.code||'—')}</b></span><span>Trạng thái: <b>Phiếu tạm · Chưa lưu</b></span></div><div class="card-head"><h2>Chi tiết nhập</h2><span class="small">${state.draft.reduce((a,x)=>a+x.qty,0)} quyển</span></div>${state.draft.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Đầu truyện</th><th>Số lượng</th><th>Đơn giá nhập</th><th>Giá thuê/ngày</th><th>Thành tiền</th><th></th></tr></thead><tbody>${state.draft.map((x,i)=>`<tr><td><b>${esc(x.title.name)}</b><div class="small">${esc(x.title.author)} · ${esc(x.title.publisher)}</div></td><td>${x.qty}</td><td class="money">${money(x.cost)}</td><td class="money">${money(x.rent)}</td><td class="money">${money(x.qty*x.cost)}</td><td class="right"><button class="btn sm" data-act="edit-line" data-index="${i}">Sửa</button> <button class="btn sm danger" data-act="remove-line" data-index="${i}">Xóa</button></td></tr>`).join('')}</tbody></table></div><div class="card-body footer-actions"><div><span class="muted">Tổng tiền nhập</span><br><b class="money">${money(state.draft.reduce((a,x)=>a+x.qty*x.cost,0))}</b></div><div>${btn('Hủy phiếu','cancel-draft',false,'danger')} ${btn('Xác nhận lưu','save-draft',true)}</div></div>`:`<div class="empty"><strong>Phiếu chưa có dòng nhập</strong>Thêm đầu truyện để bắt đầu lập phiếu.</div><div class="card-body footer-actions"><button class="btn danger" data-act="cancel-draft">Hủy phiếu</button><button class="btn primary disabled" disabled>Xác nhận lưu</button></div>`}</div>`}
function titleForm(){return `${heading('Nhập truyện · Đầu truyện','Thêm đầu truyện','Thông tin đầu truyện là bắt buộc, năm xuất bản có thể để trống.',btn('‹ Tìm đầu truyện','back-title-search'))}<div class="alert ${state.message?'errorbox':''}">${esc(state.message)}</div><form class="card" id="title-form"><div class="card-head"><h2>Thông tin đầu truyện</h2></div><div class="card-body grid"><div class="field"><label>Tên đầu truyện <span class="req">*</span></label><input name="name" required maxlength="255"></div><div class="field"><label>Tác giả <span class="req">*</span></label><input name="author" required maxlength="255"></div><div class="field"><label>Thể loại <span class="req">*</span></label><input name="category" required maxlength="255"></div><div class="field"><label>Nhà xuất bản <span class="req">*</span></label><input name="publisher" required maxlength="255"></div><div class="field"><label>Năm xuất bản</label><input name="year" type="number" min="1" max="2026" placeholder="Có thể để trống"></div><div class="field"><label>Giá nhập / quyển <span class="req">*</span></label><input name="cost" type="number" min="1" max="999999999999" required></div><div class="field"><label>Giá thuê / ngày <span class="req">*</span></label><input name="rent" type="number" min="1" max="999999999999" required></div><div class="field"><label>Số lượng <span class="req">*</span></label><input name="qty" type="number" min="1" max="10000" value="1" required></div><div class="field full"><p class="hint">Nếu đầu truyện đã có, hãy tìm và chọn đầu truyện đó trong danh mục để tránh tạo trùng.</p></div><div class="field full footer-actions"><button type="button" class="btn" data-act="back-title-search">Hủy</button><button class="btn primary">Thêm vào phiếu tạm</button></div></div></form>`}
function report(){const from=state.filter.from,to=state.filter.to;const datesValid=!!(from&&to&&from<=to),valid=datesValid&&state.scenario!=='error';const included=valid?revenueRows.filter(r=>{const [d,m,y]=r.date.split('/');const date=`${y}-${m}-${d}`;return date>=from&&date<=to}):[];const totals=new Map;included.forEach(r=>totals.set(r.supplier,(totals.get(r.supplier)||0)+r.amount));const rows=[...totals].sort((a,b)=>b[1]-a[1]);return `${heading('Báo cáo','Thống kê doanh thu NCC','Doanh thu dựa trên các hóa đơn trả trong khoảng ngày đã chọn.','<button class="btn" data-act="report-error">Mô phỏng lỗi tải</button>')}${state.scenario==='error'?`<div class="alert errorbox">Không tải được báo cáo. Hãy thử lại; mã yêu cầu DEMO-503. <button class="btn sm" data-act="report-retry">Thử lại</button></div>`:''}<div class="card"><div class="card-head"><h2>Khoảng ngày hóa đơn trả</h2><span class="small">Tính cả ngày bắt đầu và ngày kết thúc</span></div><div class="card-body grid"><div class="field"><label>Từ ngày <span class="req">*</span></label><input type="date" id="date-from" value="${esc(from)}"></div><div class="field"><label>Đến ngày <span class="req">*</span></label><input type="date" id="date-to" value="${esc(to)}"></div><div class="field full"><div class="alert ${!datesValid?'errorbox':''}">${!datesValid?'Khoảng ngày không hợp lệ. Hãy chọn đủ ngày và bảo đảm Từ ngày không sau Đến ngày.':''}</div><button class="btn primary" data-act="run-report">Xem thống kê</button></div></div></div><div class="card"><div class="card-head"><h2>Kết quả thống kê</h2><span class="small">${valid?rows.length+' nhà cung cấp':''}</span></div>${valid&&rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Hạng</th><th>Mã NCC</th><th>Nhà cung cấp</th><th class="right">Doanh thu</th><th></th></tr></thead><tbody>${rows.map(([id,sum],i)=>{const s=state.suppliers.find(x=>x.id===id);return `<tr><td>${i+1}</td><td class="code">${esc(s?.code||'')}</td><td><b>${esc(s?.name||'')}</b></td><td class="money right">${money(sum)}</td><td class="right"><button class="btn sm" data-act="report-detail" data-id="${id}">Xem hóa đơn</button></td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><strong>${valid?'Không có doanh thu trong khoảng ngày này':'Chưa thể hiển thị kết quả'}</strong>${valid?'Thay đổi khoảng ngày để tìm giao dịch.':(datesValid?'Thử tải lại báo cáo.':'Sửa thông tin ngày rồi thử lại.')}</div>`}</div>`}
function invoiceDetail(){const s=state.suppliers.find(x=>x.id===state.supplier);const rows=revenueRows.filter(r=>r.supplier===state.supplier&&(()=>{const[d,m,y]=r.date.split('/');const v=`${y}-${m}-${d}`;return v>=state.filter.from&&v<=state.filter.to})());return `${heading('Thống kê NCC · Hóa đơn trả',`Hóa đơn trả của ${esc(s?.name||'NCC')}`,`Khoảng ${dmy(state.filter.from)} – ${dmy(state.filter.to)}. Danh sách được phân theo nguồn quyển truyện.`)}<div class="crumb-actions"><button class="btn" data-act="back-report">‹ Quay lại thống kê</button></div><div class="card"><div class="card-head"><h2>Hóa đơn trả liên quan</h2><span class="small">${rows.length} dòng hóa đơn</span></div>${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Mã hóa đơn</th><th>Ngày lập</th><th>Quyển/đầu truyện</th><th class="right">Doanh thu từ NCC</th><th>Thao tác</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="code">${r.id}</td><td>${r.date}</td><td>${esc(r.books)}</td><td class="money right">${money(r.amount)}</td><td><button class="btn sm" data-act="invoice-detail" data-id="${r.id}">Chi tiết</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>Không có hóa đơn trả</strong>Thay đổi khoảng ngày hoặc quay lại kết quả thống kê.</div>`}</div>`}
function renderLogin(){app.innerHTML=`<div class="test-picker"><label for="scenario">Tình huống minh họa: </label><select id="scenario"><option value="">Bình thường</option><option value="wrong">Sai thông tin đăng nhập</option><option value="locked">Đã thử quá số lần</option><option value="system">Lỗi kết nối hệ thống</option><option value="expired">Hết phiên</option></select></div><div class="login-shell"><section class="login-visual"><div class="brand"><span class="logo">T</span><span><strong>Truyện Nhà Mình</strong><small>Quản lí cửa hàng</small></span></div><h1>Mỗi câu chuyện hay bắt đầu từ một trang sách.</h1><p>Không gian làm việc dành cho nhân viên quản lí nhà sách cho thuê truyện.</p></section><section class="login-side"><form class="login-card" id="login-form"><div class="eyebrow">Module M3</div><h2>Đăng nhập</h2><p>Nhập tài khoản nhân viên để tiếp tục.</p><div class="alert ${state.scenario?'errorbox':''}">${esc(({wrong:'Tên đăng nhập hoặc mật khẩu không đúng.',locked:'Bạn đã thử đăng nhập quá số lần. Vui lòng thử lại sau 12 phút.',system:'Hệ thống đang gặp sự cố. Hãy thử lại sau. Mã yêu cầu DEMO-503.',expired:'Phiên làm việc đã hết hạn. Hãy đăng nhập lại.'})[state.scenario]||'')}</div><div class="field"><label>Tên đăng nhập <span class="req">*</span></label><input name="username" autocomplete="username" required maxlength="120" placeholder="Tên đăng nhập"></div><div class="field"><label>Mật khẩu <span class="req">*</span></label><input name="password" type="password" autocomplete="current-password" required maxlength="1024" placeholder="Mật khẩu"></div><button class="btn primary">Đăng nhập</button><p class="small" style="margin:16px 0 0;text-align:center">Chỉ nhân viên được cấp tài khoản mới có thể đăng nhập.</p></form></section></div>`}
function modalHtml(){return `<div class="modal-back"><section class="modal" role="dialog" aria-modal="true"><div class="modal-body"><h2>${esc(state.modal.title)}</h2><p>${esc(state.modal.text)}</p><div class="modal-actions">${state.modal.no?`<button class="btn" data-act="modal-no">${esc(state.modal.no)}</button>`:''}<button class="btn primary" data-act="modal-yes">${esc(state.modal.yes)}</button></div></div></section></div>`}
function normalize(s){return s.normalize('NFC').trim().replace(/\s+/gu,' ').toLocaleLowerCase('vi')}
function supplierIsDuplicate(data,except){return state.suppliers.some(s=>s.id!==except&&(s.phone.replace('+','')===data.phone.replace('+','')||s.email.trim().toLowerCase()===data.email.trim().toLowerCase()))}
function titleDuplicate(t){return state.titles.some(x=>['name','author','category','publisher'].every(k=>normalize(x[k])===normalize(t[k]))&&(x.year||'')===(t.year||''))}
function addTitleLine(t){if(t.isNew&&titleDuplicate(t)){showFormError('Đầu truyện này đã có. Quay lại tìm và chọn đầu truyện đó.');return}const key=`${t.id}|${t.cost}|${t.rent}`,old=state.draft.find(x=>x.key===key),qty=(old?.qty||0)+t.qty;if(qty>10000||t.cost>Math.floor(999999999999/qty)){showFormError('Số lượng hoặc thành tiền dòng vượt giới hạn. Hãy điều chỉnh trước khi thêm.');return}if(t.isNew)state.titles.push(t);if(old)old.qty=qty;else state.draft.push({id:t.id,title:{...t},qty:t.qty,cost:t.cost,rent:t.rent,key});setView('import-draft');toast('Đã thêm dòng vào phiếu tạm.')}
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;switch(a){case'nav-home':if(state.draft.length){leaveDraft('home');break}setView('home');break;case'nav-supplier':if(state.draft.length){leaveDraft('supplier');break}state.query='';setView('supplier');break;case'nav-import':if(state.draft.length){setView('import-draft')}else{state.query='';setView('import-supplier')}break;case'nav-report':if(state.draft.length){leaveDraft('report');break}setView('report');break;case'open-supplier-add':state.tab='find';setView('supplier-add');break;case'back-suppliers':setView(state.tab==='import'?'import-supplier':'supplier');break;case'search-supplier':state.query=document.querySelector('#supplier-q')?.value||'';render();break;case'edit-supplier':state.supplier=Number(b.dataset.id);setView('supplier-edit');break;case'import-add-supplier':state.tab='import';setView('supplier-add');break;case'select-supplier':state.supplier=Number(b.dataset.id);setView('import-draft');break;case'change-supplier':if(state.draft.length)ask('Đổi nhà cung cấp?','Các dòng trong phiếu tạm sẽ bị xóa.',()=>{state.draft=[];state.supplier=null;setView('import-supplier')},'Giữ phiếu','Đổi NCC');else setView('import-supplier');break;case'add-title':state.message='';setView('title-add');break;case'back-draft':setView('import-draft');break;case'cancel-draft':ask('Hủy phiếu nhập?','Tất cả dòng chưa lưu trong phiếu này sẽ bị xóa.',()=>{state.draft=[];state.supplier=null;setView('home')},'Tiếp tục lập','Hủy phiếu');break;case'save-draft':if(state.draft.length)ask('Xác nhận lưu phiếu?','Prototype sẽ mô phỏng trạng thái lưu thành công. Dữ liệu không được ghi vào CSDL.',()=>{state.draft=[];state.supplier=null;setView('home');toast('Phiếu nhập đã được lưu (minh họa).')},'Kiểm tra lại','Xác nhận lưu');break;case'remove-line':ask('Xóa dòng nhập?','Dòng này sẽ bị xóa khỏi phiếu tạm.',()=>{state.draft.splice(Number(b.dataset.index),1);render();toast('Đã xóa dòng khỏi phiếu tạm.')},'Giữ lại','Xóa dòng');break;case'edit-line':{const i=Number(b.dataset.index),line=state.draft[i],qty=prompt('Số lượng mới (1–10.000):',line.qty);if(qty===null)break;const n=Number(qty);if(!Number.isInteger(n)||n<1||n>10000||line.cost>Math.floor(999999999999/n)){showFormError('Số lượng không hợp lệ hoặc thành tiền vượt giới hạn.')}else{line.qty=n;render()}break}case'run-report':state.filter.from=document.querySelector('#date-from')?.value||'';state.filter.to=document.querySelector('#date-to')?.value||'';render();break;case'report-detail':state.supplier=Number(b.dataset.id);setView('invoice');break;case'back-report':setView('report');break;case'invoice-detail':{const r=revenueRows.find(x=>x.id===b.dataset.id&&x.supplier===state.supplier);ask(`Hóa đơn ${b.dataset.id}`,`${r?.date||''} · ${r?.books||''} · Doanh thu quyển thuộc NCC: ${money(r?.amount||0)}. Chi tiết minh họa, không lấy từ CSDL.` ,()=>{},'Đóng','Đóng');break}case'modal-no':state.modal=null;app.querySelector('.modal-back')?.remove();break;case'modal-yes':{const fn=state.modal?.callback;state.modal=null;if(fn)fn();render();break}case'leave-home':if(state.draft.length)leaveDraft('home');else setView('home');break;}}
);
app.addEventListener('change',e=>{if(e.target.id==='scenario'){state.scenario=e.target.value}if(e.target.id==='supplier-select-q'){state.query=e.target.value;document.querySelector('#supplier-select-list').innerHTML=supplierSelectRows()}});
app.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=new FormData(f);if(f.id==='login-form'){const sc=document.querySelector('#scenario')?.value;if(sc){state.scenario=sc;render();return}state.employee='Nguyễn Văn A';setView('home');toast('Đăng nhập thành công (minh họa).')}if(f.id==='supplier-form'||f.id==='edit-supplier-form'){const data={name:d.get('name').trim(),address:d.get('address').trim(),phone:d.get('phone').trim(),email:d.get('email').trim()};if(!data.name||!data.address){showFormError('Tên NCC và địa chỉ không được để trống hoặc chỉ có khoảng trắng.');return}if(!/^\+?\d{10,15}$/.test(data.phone)){showFormError('Số điện thoại cần có 10–15 chữ số, có thể có dấu + ở đầu.');return}if(supplierIsDuplicate(data,f.id==='edit-supplier-form'?state.supplier:null)){showFormError('Số điện thoại hoặc email đã được dùng cho nhà cung cấp khác.');return}if(f.id==='supplier-form'){const id=100+state.suppliers.length+1;state.suppliers.push({id,code:`NCC${String(id).padStart(6,'0')}`,...data});ask('Thêm nhà cung cấp thành công','NCC đã được thêm. Chọn Quay lại tìm NCC để tiếp tục.',()=>setView(state.tab==='import'?'import-supplier':'supplier'),null,'Quay lại tìm NCC')}else{Object.assign(selectedSupplier(),data);ask('Sửa NCC thành công','Thông tin NCC đã được cập nhật.',()=>setView('home'),null,'OK')}}if(f.id==='title-form'){const t={id:state.titles.length+1,isNew:true,name:d.get('name').trim(),author:d.get('author').trim(),category:d.get('category').trim(),publisher:d.get('publisher').trim(),year:d.get('year'),cost:Number(d.get('cost')),rent:Number(d.get('rent')),qty:Number(d.get('qty'))};if(!t.name||!t.author||!t.category||!t.publisher){showFormError('Tên đầu truyện, tác giả, thể loại và nhà xuất bản không được để trống hoặc chỉ có khoảng trắng.');return}if(t.year&&(!Number.isInteger(Number(t.year))||Number(t.year)<1||Number(t.year)>2026)){showFormError('Năm xuất bản phải từ 1 đến 2026.');return}if(!Number.isInteger(t.qty)||t.qty<1||t.qty>10000||!Number.isSafeInteger(t.cost)||t.cost<1||!Number.isSafeInteger(t.rent)||t.rent<1||t.cost>Math.floor(999999999999/t.qty)){showFormError('Giá hoặc số lượng không hợp lệ; hãy kiểm tra giới hạn.');return}addTitleLine(t)}});
app.addEventListener('input',e=>{if(e.target.id==='supplier-select-q'){state.query=e.target.value;const list=document.querySelector('#supplier-select-list');if(list)list.innerHTML=supplierSelectRows()}});
app.addEventListener('input',e=>{if(e.target.id==='title-query'){state.titleQuery=e.target.value;const list=document.querySelector('#title-search-list');if(list)list.innerHTML=titleSearchRows()}});
app.addEventListener('submit',e=>{if(e.target.id!=='existing-title-form')return;e.preventDefault();const d=new FormData(e.target),title=state.titles.find(x=>x.id===state.formTitle);const t={id:title.id,name:title.name,author:title.author,category:title.category,publisher:title.publisher,year:title.year,cost:Number(d.get('cost')),rent:Number(d.get('rent')),qty:Number(d.get('qty')),isNew:false};if(!Number.isInteger(t.qty)||t.qty<1||t.qty>10000||!Number.isSafeInteger(t.cost)||t.cost<1||!Number.isSafeInteger(t.rent)||t.rent<1||t.cost>Math.floor(999999999999/t.qty)){showFormError('Giá hoặc số lượng không hợp lệ; hãy kiểm tra giới hạn.');return}addTitleLine(t)});
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.dataset.act==='search-title'){state.titleQuery=document.querySelector('#title-query')?.value||'';render()}if(b.dataset.act==='open-new-title')setView('title-new');if(b.dataset.act==='select-title'){state.formTitle=Number(b.dataset.id);setView('title-existing')}if(b.dataset.act==='back-title-search')setView('title-add')});
function titleSearchRows(){const q=state.titleQuery.trim().toLocaleLowerCase('vi'),rows=state.titles.filter(t=>!q||[t.name,t.author,t.publisher].some(v=>v.toLocaleLowerCase('vi').includes(q)));return rows.length?'<div class="table-wrap"><table class="table"><thead><tr><th>Tên đầu truyện</th><th>Tác giả</th><th>Thể loại</th><th>Nhà xuất bản</th><th>Năm</th><th></th></tr></thead><tbody>'+rows.map(t=>'<tr><td><b>'+esc(t.name)+'</b></td><td>'+esc(t.author)+'</td><td>'+esc(t.category)+'</td><td>'+esc(t.publisher)+'</td><td>'+esc(t.year||'—')+'</td><td><button class="btn primary sm" data-act="select-title" data-id="'+t.id+'">Chọn</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty"><strong>Không tìm thấy đầu truyện</strong>Thử từ khóa khác hoặc thêm đầu truyện mới.</div>'}
function titleSearch(){return heading('Nhập truyện · Đầu truyện','Tìm đầu truyện','Tìm trước khi thêm mới để tránh tạo đầu truyện trùng.',btn('‹ Quay lại phiếu','back-draft'))+'<div class="card"><div class="card-body"><div class="field full"><label for="title-query">Tên, tác giả hoặc nhà xuất bản</label><div class="inline"><input id="title-query" value="'+esc(state.titleQuery)+'" placeholder="Ví dụ: Doraemon"><button class="btn primary" data-act="search-title">Tìm</button></div></div><div class="field full"><button class="btn" data-act="open-new-title">＋ Thêm đầu truyện mới</button></div></div></div><div class="alert '+(state.message?'errorbox':'')+'">'+esc(state.message)+'</div><div class="card"><div class="card-head"><h2>Đầu truyện</h2></div><div id="title-search-list">'+titleSearchRows()+'</div></div>'}
function existingTitleForm(){const t=state.titles.find(x=>x.id===state.formTitle);if(!t)return heading('Nhập truyện','Không tìm thấy đầu truyện','Tìm lại đầu truyện.',btn('‹ Tìm đầu truyện','back-title-search'));return heading('Nhập truyện · Dòng nhập','Thêm quyển vào phiếu','Đầu truyện đã có; nhập giá và số lượng cho phiếu hiện tại.',btn('‹ Tìm đầu truyện','back-title-search'))+'<div class="alert '+(state.message?'errorbox':'')+'">'+esc(state.message)+'</div><form class="card" id="existing-title-form"><div class="card-head"><h2>'+esc(t.name)+'</h2><span class="small">'+esc(t.author)+' · '+esc(t.publisher)+'</span></div><div class="card-body grid"><div class="field"><label>Giá nhập / quyển <span class="req">*</span></label><input name="cost" type="number" min="1" max="999999999999" required></div><div class="field"><label>Giá thuê / ngày <span class="req">*</span></label><input name="rent" type="number" min="1" max="999999999999" required></div><div class="field"><label>Số lượng <span class="req">*</span></label><input name="qty" type="number" min="1" max="10000" value="1" required></div><div class="field full footer-actions"><button type="button" class="btn" data-act="back-title-search">Hủy</button><button class="btn primary">Thêm vào phiếu tạm</button></div></div></form>'}
window.addEventListener('beforeunload',e=>{if(state.draft.length){e.preventDefault();e.returnValue='';}});const previewView=new URLSearchParams(location.search).get('view');if(['login','supplier','supplier-add','supplier-edit','import-supplier','import-draft','title-add','title-new','title-existing','report','invoice'].includes(previewView)){state.view=previewView}if(previewView==='import-draft'){state.supplier=101;state.draft=[{key:'1|40000|10000',id:1,title:state.titles[0],qty:2,cost:40000,rent:10000}]}if(previewView==='supplier-edit')state.supplier=101;if(previewView==='title-existing')state.formTitle=1;if(previewView==='invoice')state.supplier=101;app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.dataset.act==='report-error'){state.scenario='error';render()}if(b.dataset.act==='report-retry'){state.scenario='';render()}});render();
</script></body></html>
