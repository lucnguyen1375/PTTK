services:
  db:
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    environment:
      MYSQL_DATABASE: ${DB_NAME:-pttk_m3}
      MYSQL_USER: ${DB_USER:-pttk_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Create web/.env from .env.example and set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Create web/.env from .env.example and set MYSQL_ROOT_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+07:00
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  app:
    image: pttk-m3-app:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-pttk_m3}
      DB_USER: ${DB_USER:-pttk_app}
      DB_PASSWORD: ${DB_PASSWORD:?Create web/.env from .env.example and set DB_PASSWORD}
      DB_CONNECT_TIMEOUT_MS: 5000
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      db:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - app-network
    restart: unless-stopped

  db-tools:
    image: maven:3.9.16-eclipse-temurin-21@sha256:99e61abcff91a9b1333463bd8451fb18495d6eba9250ac66a338b518f8278320
    profiles: [tools]
    working_dir: /workspace
    entrypoint: [mvn]
    command: [-B, -ntp, -Pdb-tools, flyway:migrate]
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-pttk_m3}
      DB_USER: ${DB_USER:-pttk_app}
      DB_PASSWORD: ${DB_PASSWORD:?Create web/.env from .env.example and set DB_PASSWORD}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - .:/workspace:ro
      - maven-target:/workspace/target
      - maven-cache:/root/.m2
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
  maven-target:
  maven-cache:
